<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <title>Eight-stage workstation troubleshooting workflow</title>
  <desc>
    A representative IT support method covering intake, data protection, hardware inspection,
    Windows checks, software and driver review, network diagnosis, printer testing, and final documentation.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff" />
      <stop offset="1" stop-color="#ecfeff" />
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".13" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1400" height="900" rx="40" fill="url(#background)" />
  <circle cx="1280" cy="100" r="170" fill="#bfdbfe" opacity=".45" />
  <circle cx="110" cy="820" r="210" fill="#a5f3fc" opacity=".35" />

  <text x="700" y="72" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">
    Workstation Support Method
  </text>
  <text x="700" y="112" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Representative sequence — adapt each check to the reported issue
  </text>

  <g fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 330 270 H 395" />
    <path d="M 670 270 H 735" />
    <path d="M 1010 270 H 1075" />
    <path d="M 1215 360 V 455" />
    <path d="M 1075 585 H 1010" />
    <path d="M 735 585 H 670" />
    <path d="M 395 585 H 330" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 170)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">1</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Intake &amp; priority</text>
      <text x="28" y="135" fill="#475569" font-size="18">Record symptoms, recent</text>
      <text x="28" y="163" fill="#475569" font-size="18">changes, users, and impact.</text>
    </g>

    <g transform="translate(395 170)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">2</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Protect user data</text>
      <text x="28" y="135" fill="#475569" font-size="18">Confirm important files and</text>
      <text x="28" y="163" fill="#475569" font-size="18">a safe backup before changes.</text>
    </g>

    <g transform="translate(735 170)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">3</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Inspect hardware</text>
      <text x="28" y="135" fill="#475569" font-size="18">Check power, cables, devices,</text>
      <text x="28" y="163" fill="#475569" font-size="18">connections, and ventilation.</text>
    </g>

    <g transform="translate(1075 170)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">4</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Review Windows</text>
      <text x="28" y="135" fill="#475569" font-size="18">Check startup, storage, load,</text>
      <text x="28" y="163" fill="#475569" font-size="18">services, and performance.</text>
    </g>

    <g transform="translate(1075 485)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bae6fd" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">5</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Software &amp; drivers</text>
      <text x="28" y="135" fill="#475569" font-size="18">Review updates, drivers, and</text>
      <text x="28" y="163" fill="#475569" font-size="18">essential applications.</text>
    </g>

    <g transform="translate(735 485)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bae6fd" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">6</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Diagnose network</text>
      <text x="28" y="135" fill="#475569" font-size="18">Test adapter, IP, gateway,</text>
      <text x="28" y="163" fill="#475569" font-size="18">internet access, and DNS.</text>
    </g>

    <g transform="translate(395 485)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#bae6fd" stroke-width="3" />
      <circle cx="48" cy="48" r="27" fill="url(#primary)" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">7</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Test printer access</text>
      <text x="28" y="135" fill="#475569" font-size="18">Check connection, driver,</text>
      <text x="28" y="163" fill="#475569" font-size="18">queue, default, and output.</text>
    </g>

    <g transform="translate(55 485)">
      <rect width="275" height="200" rx="24" fill="#ffffff" stroke="#86efac" stroke-width="4" />
      <circle cx="48" cy="48" r="27" fill="#16a34a" />
      <text x="48" y="57" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">8</text>
      <text x="28" y="100" fill="#0f172a" font-size="25" font-weight="700">Validate &amp; document</text>
      <text x="28" y="135" fill="#475569" font-size="18">Repeat the user task, record</text>
      <text x="28" y="163" fill="#475569" font-size="18">results, and explain next steps.</text>
    </g>
  </g>

  <g transform="translate(235 755)" font-family="Arial, Helvetica, sans-serif">
    <rect width="930" height="86" rx="22" fill="#0f172a" />
    <text x="465" y="36" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">
      Evidence boundary
    </text>
    <text x="465" y="66" text-anchor="middle" fill="#cbd5e1" font-size="18">
      This diagram documents a reusable method; it does not claim a client SLA or guaranteed result.
    </text>
  </g>
</svg>
