name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/assistant-intents.js
          node --check assets/js/contact-assistant.js
          node --check assets/js/main.js

      - name: Test Quick Assistant intent classification
        run: node scripts/test_assistant_intents.js

      - name: Validate site structure and data
        run: python3 scripts/validate_site.py
